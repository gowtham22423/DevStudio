<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | DevStudio Onboarding</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script>
    // Auth & Onboarding Guard
    if (localStorage.getItem('devstudio_logged_in') !== 'true') {
      window.location.replace('login.html');
    } else {
      const step = localStorage.getItem('devstudio_onboarding_step');
      if (step && step !== 'welcome') {
        if (step === 'profile') window.location.replace('profile-setup.html');
        else if (step === 'preferences') window.location.replace('preferences.html');
        else if (step === 'tutorial') window.location.replace('tutorial.html');
        else if (step === 'completed') window.location.replace('index.html');
      }
    }
  </script>
  <style>
    .onboard-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, rgba(255, 255, 255, 1) 90%);
      padding: 2rem 1rem;
      font-family: var(--font-sans);
    }
    .onboard-card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .progress-container {
      width: 100%;
      height: 6px;
      background-color: var(--bg-slate-100);
      border-radius: 9999px;
      margin: 1.5rem 0 2rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary-color);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body class="onboard-body">

  <div class="onboard-card">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 2rem;">
      DevStudio<span class="logo-dot"></span>
    </a>
    
    <span class="badge" style="margin-bottom: 1rem;">Step 1 of 4: Welcome</span>
    
    <h2 style="font-size: 1.75rem; color: var(--secondary-color); margin-bottom: 1rem; letter-spacing: -0.02em;">
      Welcome to Your Portal!
    </h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
      Thank you for logging in! We've prepared a brief step-by-step setup wizard to configure your project workspace preferences and help you navigate the system.
    </p>

    <!-- Progress Indicator -->
    <div class="progress-container">
      <div class="progress-bar" style="width: 25%;"></div>
    </div>

    <!-- Navigation Action -->
    <button id="nextStepBtn" class="btn btn-primary" style="width: 100%; justify-content: center; gap: 0.5rem;">
      Next: Setup Profile
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

  <script>
    document.getElementById('nextStepBtn').addEventListener('click', () => {
      localStorage.setItem('devstudio_onboarding_step', 'profile');
      window.location.href = "profile-setup.html";
    });
  </script>
</body>
</html>
